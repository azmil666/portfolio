<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azmil Mohammed | Coming Soon</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rye&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        
        :root {
            --bg-sand: #f4ebd8;
            --text-dark: #3e2723; 
            --accent-terracotta: #d85c41;
            --accent-denim: #4a6fa5;
            --sun-glow: #eab676;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-sand);
            color: var(--text-dark);
            font-family: 'Space Mono', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            background-image: radial-gradient(circle at center, transparent 0%, rgba(62, 39, 35, 0.05) 100%);
        }

        
        .desert-sun {
            position: absolute;
            width: 60vw;
            height: 60vw;
            max-width: 600px;
            max-height: 600px;
            background: radial-gradient(circle, var(--sun-glow) 0%, transparent 60%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulseSun 8s infinite alternate ease-in-out;
            z-index: 0;
            opacity: 0.5;
        }

        @keyframes pulseSun {
            0% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.4; }
            100% { transform: translate(-50%, -50%) scale(1.05); opacity: 0.7; }
        }

        
        .dust {
            position: absolute;
            background-color: #c4b59d;
            border-radius: 50%;
            opacity: 0.6;
            pointer-events: none;
            z-index: 1;
        }

        
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 800px;
            width: 100%;
            z-index: 2;
            position: relative;
        }

        
        h1 {
            font-family: 'Rye', serif;
            font-size: clamp(3rem, 8vw, 5.5rem);
            font-weight: 400;
            line-height: 1.2;
            margin-bottom: 1rem;
            color: var(--text-dark);
            text-shadow: 3px 3px 0px var(--accent-terracotta);
            letter-spacing: 2px;
            opacity: 0;
            animation: stampIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        h2 {
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            font-weight: 700;
            color: var(--accent-denim);
            margin-bottom: 2rem;
            line-height: 1.5;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUpFade 0.8s ease forwards 0.4s;
        }

        .status-badge {
            display: inline-block;
            margin-bottom: 3rem;
            padding: 0.5rem 1.25rem;
            border: 2px dashed var(--accent-terracotta);
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-terracotta);
            opacity: 0;
            animation: fadeIn 1s ease forwards 0.8s;
            transform: rotate(-2deg);
            transition: transform 0.3s ease;
        }

        .status-badge:hover {
            transform: rotate(0deg) scale(1.05);
        }

        
        .btn-wrapper {
            opacity: 0;
            animation: slideUpFade 0.8s ease forwards 1s;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            background: var(--bg-sand);
            color: var(--text-dark);
            text-decoration: none;
            padding: 0.875rem 2.5rem;
            font-weight: 700;
            font-size: 1.1rem;
            border: 2px solid var(--text-dark);
            border-radius: 0; 
            box-shadow: 6px 6px 0px var(--text-dark);
            transition: all 0.15s ease;
            position: relative;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translate(2px, 2px);
            box-shadow: 4px 4px 0px var(--text-dark);
            background: #eadebc;
        }

        .btn:active {
            transform: translate(6px, 6px);
            box-shadow: 0px 0px 0px var(--text-dark);
        }

        .btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

       
        @keyframes stampIn {
            0% { opacity: 0; transform: scale(1.5) rotate(-5deg); }
            100% { opacity: 1; transform: scale(1) rotate(0); }
        }

        @keyframes slideUpFade {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes drift {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-100vh) translateX(100px) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="desert-sun"></div>

    <div class="container">
        <h1>Azmil Mohammed</h1>
        
        <h2>Crafting digital spaces, useful tools, and weekend experiments for the web.</h2>
        
        <div class="status-badge">
            Portfolio Launching Soon
        </div>

        <div class="btn-wrapper">
            <a href="https://github.com/azmil666" target="_blank" rel="noopener noreferrer" class="btn">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
                </svg>
                My GitHub
            </a>
        </div>
    </div>

    <script>
        function createDustParticles() {
            const body = document.querySelector('body');
            const particleCount = 20;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('dust');
                
                
                const size = Math.random() * 6 + 2; 
                const startX = Math.random() * window.innerWidth;
                const startY = window.innerHeight + (Math.random() * 200); 
                const duration = Math.random() * 15 + 10; 
                const delay = Math.random() * 10; 

                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${startX}px`;
                particle.style.top = `${startY}px`;
                particle.style.animation = `drift ${duration}s linear ${delay}s infinite`;

                body.appendChild(particle);
            }
        }

        
        window.addEventListener('DOMContentLoaded', createDustParticles);
    </script>
</body>
</html>
